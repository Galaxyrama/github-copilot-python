<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Sudoku Game</h1>
  <div class="game-status" aria-live="polite">
    <span>Difficulty: <strong id="difficulty-level">Medium</strong></span>
    <span>Time: <strong id="timer">00:00</strong></span>
    <span>Hints: <strong id="hints-used">0</strong></span>
  </div>
  <div id="sudoku-board"></div>
  <div class="controls">
    <button id="new-game" type="button">New Game</button>
    <button id="hint" type="button">Hint</button>
    <button id="check-solution" type="button">Check Solution</button>
    <button id="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">Dark / Light Mode</button>
    <span id="message"></span>
  </div>
  <p id="scoreboard-status" aria-live="polite"></p>
  <section class="scoreboard" aria-labelledby="scoreboard-title">
    <h2 id="scoreboard-title">Top 10 Fastest Times</h2>
    <div class="scoreboard-scroll">
      <table>
        <thead>
          <tr>
            <th scope="col">Rank</th>
            <th scope="col">Name</th>
            <th scope="col">Time</th>
            <th scope="col">Level</th>
            <th scope="col">Hints</th>
          </tr>
        </thead>
        <tbody id="scoreboard-body"></tbody>
      </table>
    </div>
  </section>
  <dialog id="difficulty-modal" aria-labelledby="difficulty-title">
    <div class="modal-content">
      <h2 id="difficulty-title">Choose a difficulty</h2>
      <div class="difficulty-options">
        <button type="button" data-difficulty="easy">Easy</button>
        <button type="button" data-difficulty="medium">Medium</button>
        <button type="button" data-difficulty="hard">Hard</button>
      </div>
      <button id="cancel-new-game" class="secondary-button" type="button">Cancel</button>
    </div>
  </dialog>
  <dialog id="completion-modal" aria-labelledby="completion-title">
    <form id="score-form" class="modal-content">
      <h2 id="completion-title">Puzzle complete!</h2>
      <p id="completion-message"></p>
      <label for="player-name">Name for the leaderboard</label>
      <input id="player-name" name="player-name" type="text" maxlength="40" autocomplete="name">
      <button type="submit">Save Score</button>
    </form>
  </dialog>
  <script src="/static/scoreboard.js"></script>
  <script src="/static/main.js"></script>
</body>
</html>
